name: Build all ESP-IDF v6.1 PDFs (11 targets)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    name: PDF - ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target:
          - esp32
          - esp32s2
          - esp32s3
          - esp32s31
          - esp32c2
          - esp32c3
          - esp32c5
          - esp32c6
          - esp32c61
          - esp32h2
          - esp32p4

    steps:
      - name: Checkout official ESP-IDF v6.1
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-idf
          ref: v6.1
          submodules: recursive
          fetch-depth: 1

      - name: Install LaTeX and system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            doxygen graphviz cmake ninja-build poppler-utils librsvg2-bin \
            latexmk texlive-xetex texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-chinese \
            fonts-freefont-otf fonts-lmodern

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install complete ESP-IDF environment
        run: ./install.sh "${{ matrix.target }}" --enable-docs

      # Keep all original SVG files. Retry only a failed CairoSVG conversion
      # using librsvg (alternative renderer for the very same input file).
      - name: Add SVG converter fallback without editing documentation
        shell: bash
        run: |
          set -euo pipefail
          . ./export.sh
          python - <<'PY_SVG_FALLBACK'
          import inspect
          from pathlib import Path
          import sphinxcontrib.cairosvgconverter as converter

          module_file = Path(inspect.getfile(converter.CairoSVGConverter))
          original = module_file.read_text(encoding='utf-8')
          anchor = '        except (OSError, URLError) as err:'
          assert original.count(anchor) == 1, f'Unexpected converter code in {module_file}'
          fallback = (
              '        except ValueError as err:\n'
              '            import subprocess\n'
              '            logger.info("CairoSVG failed for %s: %s; retrying with librsvg", _from, err)\n'
              '            subprocess.run(\n'
              '                ["rsvg-convert", "--format=pdf", "--output", str(_to), str(_from)],\n'
              '                check=True,\n'
              '            )\n'
          )
          patched = original.replace(anchor, fallback + anchor)
          compile(patched, str(module_file), 'exec')
          module_file.write_text(patched, encoding='utf-8')
          print('SVG fallback installed in:', module_file)
          PY_SVG_FALLBACK
          command -v rsvg-convert
          printf '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><rect width="20" height="20" fill="lightblue"/></svg>\n' > /tmp/test-svg-converter.svg
          rsvg-convert --format=pdf --output=/tmp/test-svg-converter.pdf /tmp/test-svg-converter.svg
          pdfinfo /tmp/test-svg-converter.pdf | grep '^Pages:'

      - name: Setup Node.js for Mermaid diagrams
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and test Mermaid CLI
        shell: bash
        run: |
          npm install --global @mermaid-js/mermaid-cli
          cat > docs/puppeteer-config.json <<'EOF_PUPPETEER'
          {"args": ["--no-sandbox"]}
          EOF_PUPPETEER
          mmdc --version
          printf 'flowchart TD\n  A[Start] --> B[End]\n' > /tmp/test-mermaid.mmd
          mmdc -p "$PWD/docs/puppeteer-config.json" \
            -i /tmp/test-mermaid.mmd -o /tmp/test-mermaid.svg
          test -s /tmp/test-mermaid.svg

      - name: Configure PDF metadata and Mermaid renderer
        shell: bash
        run: |
          cat >> docs/en/conf.py <<'EOF_PDF'

          # Settings for the ESP-IDF v6.1 GitHub Actions PDF build
          pdf_title = 'ESP-IDF Programming Guide'
          pdf_file_prefix = 'esp-idf'

          import os as _pdf_os
          mermaid_params = [
              '-p',
              _pdf_os.path.abspath(
                  _pdf_os.path.join(_pdf_os.path.dirname(__file__), '..', 'puppeteer-config.json')
              ),
          ]
          EOF_PDF

      # Sphinx's latexmkrc refers to python.ist by a relative filename.
      # In the Espressif build the style is not in makeindex's search path.
      - name: Fix and test Sphinx MakeIndex style path
        shell: bash
        run: |
          . ./export.sh
          python - <<'PY_FIX_INDEX'
          from pathlib import Path
          import sphinx

          texinputs = Path(sphinx.__file__).resolve().parent / 'texinputs'
          template = texinputs / 'latexmkrc_t'
          style = texinputs / 'python.ist'
          assert template.is_file(), f'Missing Sphinx latexmk template: {template}'
          assert style.is_file(), f'Missing Sphinx MakeIndex style: {style}'
          contents = template.read_text(encoding='utf-8')
          old = 'makeindex -s python.ist'
          assert old in contents, f'Expected MakeIndex command not found in {template}'
          contents = contents.replace(old, 'makeindex -s ' + str(style))
          # Latexmk's usual five passes were insufficient for this huge document.
          # Add the setting to the generated latexmkrc template, not a separate
          # rc file which latexmk might not load in the same directory.
          if '$max_repeat' not in contents:
              contents += '\n$max_repeat = 12;\n'
          template.write_text(contents, encoding='utf-8')
          print(f'MakeIndex style resolved to: {style}')
          print('Patched Sphinx latexmkrc template:', template)
          print('Latexmk max_repeat: 12')
          PY_FIX_INDEX
          # Fail early instead of discovering the missing style after 3000+ pages.
          STYLE=$(python -c 'from pathlib import Path; import sphinx; print(Path(sphinx.__file__).resolve().parent / "texinputs" / "python.ist")')
          # openout_any=p prohibits absolute output paths for makeindex.
          # Use relative filenames from inside a temporary directory.
          TEST_DIR="$(mktemp -d)"
          (
            cd "$TEST_DIR"
            printf '\indexentry{makeindex-test}{1}\n' > sphinx-index-test.idx
            makeindex -s "$STYLE" -o sphinx-index-test.ind sphinx-index-test.idx
            test -s sphinx-index-test.ind
          )
          rm -rf "$TEST_DIR"
          echo 'MakeIndex preflight test passed.'

      # XeLaTeX exhausted its main memory when reading the large hyperref
      # bookmark (.out) file. main_memory requires rebuilding the .fmt file.
      # extra_mem_top supplements runtime memory without a format rebuild.
      - name: Increase XeLaTeX memory and rebuild format
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'main_memory = 7000000' \
            'extra_mem_top = 12000000' \
            'pool_size = 30000000' \
            | sudo tee /etc/texmf/texmf.d/99-esp-idf-pdf.cnf
          sudo update-texmf
          echo '=== Effective TeX memory configuration ==='
          for key in main_memory extra_mem_top pool_size; do
            printf '%s = %s\n' "$key" "$(kpsewhich -var-value="$key")"
          done
          test "$(kpsewhich -var-value=main_memory)" -eq 7000000
          test "$(kpsewhich -var-value=extra_mem_top)" -eq 12000000
          test "$(kpsewhich -var-value=pool_size)" -eq 30000000
          sudo fmtutil-sys --byfmt xelatex
          echo 'XeLaTeX format rebuild completed successfully.'
          # fmtutil-sys already verifies success via its exit code.
          # Do not use `kpsewhich xelatex.fmt` here: it can return empty
          # without the explicit format search category, even when rebuilt.

      # In the upstream TWAI documentation, underscores inside \text{...}
      # aren't escaped. XeLaTeX therefore aborts on the timing formulas.
      # Apply the smallest possible LaTeX-only correction in this temporary
      # checkout. The published repository and original diagrams stay intact.
      - name: Fix TWAI LaTeX math syntax for PDF build
        shell: bash
        run: |
          python - <<'PY_FIX_TWAI'
          from pathlib import Path

          source = Path('docs/en/api-reference/peripherals/twai.rst')
          original = source.read_text(encoding='utf-8')
          replacements = {
              r'\text{prop_seg}': r'\text{prop\_seg}',
              r'\text{sample_point}': r'\text{sample\_point}',
          }
          for old, new in replacements.items():
              count = original.count(old)
              if count == 0:
                  raise RuntimeError(f'Expected TWAI math expression not found: {old}')
              print(f'Correcting {count} occurrence(s) of {old} in {source}')
              original = original.replace(old, new)
          source.write_text(original, encoding='utf-8')
          PY_FIX_TWAI

      - name: Build ${{ matrix.target }} PDF
        shell: bash
        env:
          # ESP-IDF has exceptionally large LaTeX auxiliary files.
          # Keep the enlarged string pool for the Sphinx/LaTeX build.
          pool_size: "30000000"
        run: |
          echo "Effective XeTeX pool_size: $(kpsewhich -var-value=pool_size)"
          echo "Effective XeTeX main_memory: $(kpsewhich -var-value=main_memory)"
          echo "Effective XeTeX extra_mem_top: $(kpsewhich -var-value=extra_mem_top)"
          test "$(kpsewhich -var-value=pool_size)" -eq 30000000
          . ./export.sh
          cd docs
          # Preserve both stdout and stderr for the entire Sphinx + latexmk run.
          # pipefail keeps the actual build exit code even when tee succeeds.
          set -o pipefail
          build-docs -bs latex -t ${{ matrix.target }} -l en 2>&1 | tee "$GITHUB_WORKSPACE/pdf-build-full.log"

      # Save an already generated PDF even if a later LaTeX pass fails.
      # This does not mark the build successful; logs remain available.
      - name: Check for generated PDF (also after failure)
        if: always()
        shell: bash
        run: |
          PDF_DIR="docs/_build/en/${{ matrix.target }}/latex/build"
          echo "Checking ${PDF_DIR}"
          if [ -d "$PDF_DIR" ]; then
            find "$PDF_DIR" -maxdepth 1 -type f -name '*.pdf' -printf '%f (%s bytes)\n'
            while IFS= read -r -d '' file; do
              pdfinfo "$file" | grep -E '^(Pages|Page size|File size):' || true
            done < <(find "$PDF_DIR" -maxdepth 1 -type f -name '*.pdf' -size +0c -print0)
          else
            echo "No LaTeX build directory found"
          fi

      - name: Upload existing PDF even if LaTeX build fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ESP-IDF-v6.1-${{ matrix.target }}-PDF-first-pass
          path: docs/_build/en/${{ matrix.target }}/latex/build/*.pdf
          if-no-files-found: warn
          retention-days: 7

      - name: Diagnose Sphinx and Latexmk failure
        if: failure()
        shell: bash
        run: |
          echo '=== Last 250 lines of complete build console output ==='
          if [ -f pdf-build-full.log ]; then
            tail -n 250 pdf-build-full.log
          fi
          echo '=== Important errors throughout console output ==='
          if [ -f pdf-build-full.log ]; then
            grep -nEi '(^! |fatal|emergency stop|capacity exceeded|error:|latexmk:|undefined control sequence|no pages of output|failed)' pdf-build-full.log | tail -n 150 || true
          fi
          echo '=== Latexmk settings ==='
          cat docs/_build/en/${{ matrix.target }}/latex/latexmkrc 2>/dev/null || true
          echo '=== Latexmk database and logs ==='
          find docs/_build/en/${{ matrix.target }}/latex -type f \
            \( -name '*.log' -o -name '*.fdb_latexmk' -o -name '*.fls' \) -printf '%p (%s bytes)\n' | tail -n 50 || true
          while IFS= read -r -d '' log; do
            echo "=== Tail of $log ==="
            tail -n 100 "$log"
            echo "=== First TeX error in $log (if present) ==="
            grep -n -m 5 -E '^! |^l\.[0-9]+|Emergency stop|Fatal error|TeX capacity exceeded' "$log" || true
          done < <(find docs/_build/en/${{ matrix.target }}/latex -type f -name '*.log' -print0 2>/dev/null)

      - name: Upload full diagnostics even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-PDF-Full-Diagnostics
          path: |
            pdf-build-full.log
            docs/_build/en/${{ matrix.target }}/latex/**/*.log
            docs/_build/en/${{ matrix.target }}/latex/**/*.fdb_latexmk
            docs/_build/en/${{ matrix.target }}/latex/**/*.fls
            docs/_build/en/${{ matrix.target }}/latex/**/*.aux
            docs/_build/en/${{ matrix.target }}/latex/**/*.out
            docs/_build/en/${{ matrix.target }}/latex/**/*.toc
            docs/_build/en/${{ matrix.target }}/latex/**/*.ilg
            docs/_build/en/${{ matrix.target }}/latex/**/*.ind
            docs/_build/en/${{ matrix.target }}/latex/latexmkrc
            docs/_build/en/${{ matrix.target }}/sphinx-build-output-latex.txt
            docs/_build/en/${{ matrix.target }}/sphinx-warning-log.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Verify generated PDF
        shell: bash
        run: |
          mapfile -d '' pdfs < <(find docs/_build/en/${{ matrix.target }}/latex \
            -type f -name '*.pdf' -size +0c -print0)
          if [ "${#pdfs[@]}" -eq 0 ]; then
            echo 'ERROR: No nonempty PDF generated.' >&2
            exit 1
          fi
          for pdf in "${pdfs[@]}"; do
            pdfinfo "$pdf" | grep -E '^(Pages|Page size|File size):'
            echo "Verified PDF: $pdf"
          done

      - name: Upload generated PDFs
        uses: actions/upload-artifact@v4
        with:
          name: ESP-IDF-v6.1-${{ matrix.target }}-English-PDF
          path: docs/_build/en/${{ matrix.target }}/latex/**/*.pdf
          if-no-files-found: error
          retention-days: 7
