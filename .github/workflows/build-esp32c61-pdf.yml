
name: Build ESP32-C61 PDF (ESP-IDF v6.1.1)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout ESP-IDF v6.1.1
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-idf
          ref: v6.1.1
          submodules: recursive
          fetch-depth: 1

      - name: Install LaTeX and system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            doxygen graphviz cmake ninja-build \
            latexmk texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            fonts-freefont-otf fonts-lmodern

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install complete ESP-IDF environment
        run: |
          ./install.sh esp32c61 --enable-docs

      - name: Build ESP32-C61 PDF
        shell: bash
        run: |
          . ./export.sh
          cd docs
          build-docs -bs latex -t esp32c61 -l en

      - name: Verify generated PDFs
        shell: bash
        run: |
          find docs/_build/en/esp32c61/latex \
            -type f -name '*.pdf' -print

          count=$(find docs/_build/en/esp32c61/latex \
            -type f -name '*.pdf' -size +0c | wc -l)

          if [ "$count" -eq 0 ]; then
            echo "ERROR: No valid PDF generated"
            exit 1
          fi

      - name: Upload PDF files
        uses: actions/upload-artifact@v4
        with:
          name: ESP-IDF-v6.1.1-ESP32C61-PDF
          path: docs/_build/en/esp32c61/latex/**/*.pdf
          if-no-files-found: error
          retention-days: 7
