name: Build ESP32-C61 PDF (ESP-IDF v6.1.1)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout official ESP-IDF v6.1.1
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-idf
          ref: v6.1.1
          submodules: recursive
          fetch-depth: 1

      - name: Install LaTeX and system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            doxygen graphviz cmake ninja-build \
            latexmk texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            fonts-freefont-otf fonts-lmodern

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install complete ESP-IDF environment
        run: |
          ./install.sh esp32c61 --enable-docs

      - name: Configure PDF metadata
        run: |
          cat >> docs/en/conf.py <<'EOF_PDF'

          # Required by esp-docs LaTeX builder
          pdf_title = 'ESP-IDF Programming Guide'
          pdf_file_prefix = 'esp-idf'
          EOF_PDF

      - name: Build ESP32-C61 PDF
        shell: bash
        run: |
          . ./export.sh
          cd docs
          build-docs -bs latex -t esp32c61 -l en

      - name: Verify generated PDF
        shell: bash
        run: |
          mapfile -d '' pdfs < <(find docs/_build/en/esp32c61/latex -type f -name '*.pdf' -size +0c -print0)
          if [ "${#pdfs[@]}" -eq 0 ]; then
            echo 'ERROR: No nonempty PDF generated.' >&2
            exit 1
          fi
          for pdf in "${pdfs[@]}"; do
            pdfinfo "$pdf" | grep -E '^(Pages|Page size|File size):'
            echo "Verified PDF: $pdf"
          done

      - name: Upload generated PDF
        uses: actions/upload-artifact@v4
        with:
          name: ESP-IDF-v6.1.1-ESP32C61-English-PDF
          path: docs/_build/en/esp32c61/latex/**/*.pdf
          if-no-files-found: error
          retention-days: 7
