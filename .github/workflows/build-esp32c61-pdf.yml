name: Build ESP32-C61 PDF (ESP-IDF v6.1.1)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout official ESP-IDF v6.1.1
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-idf
          ref: v6.1.1
          submodules: recursive
          fetch-depth: 1

      - name: Install LaTeX and system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            doxygen graphviz cmake ninja-build poppler-utils \
            latexmk texlive-xetex texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-chinese \
            fonts-freefont-otf fonts-lmodern

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install complete ESP-IDF environment
        run: ./install.sh esp32c61 --enable-docs

      - name: Setup Node.js for Mermaid diagrams
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and test Mermaid CLI
        shell: bash
        run: |
          npm install --global @mermaid-js/mermaid-cli
          cat > docs/puppeteer-config.json <<'EOF_PUPPETEER'
          {"args": ["--no-sandbox"]}
          EOF_PUPPETEER
          mmdc --version
          printf 'flowchart TD\n  A[Start] --> B[End]\n' > /tmp/test-mermaid.mmd
          mmdc -p "$PWD/docs/puppeteer-config.json" \
            -i /tmp/test-mermaid.mmd -o /tmp/test-mermaid.svg
          test -s /tmp/test-mermaid.svg

      - name: Configure PDF metadata and Mermaid renderer
        shell: bash
        run: |
          cat >> docs/en/conf.py <<'EOF_PDF'

          # Settings for the ESP-IDF v6.1.1 GitHub Actions PDF build
          pdf_title = 'ESP-IDF Programming Guide'
          pdf_file_prefix = 'esp-idf'

          import os as _pdf_os
          mermaid_params = [
              '-p',
              _pdf_os.path.abspath(
                  _pdf_os.path.join(_pdf_os.path.dirname(__file__), '..', 'puppeteer-config.json')
              ),
          ]
          EOF_PDF

      - name: Build ESP32-C61 PDF
        shell: bash
        env:
          # ESP-IDF has exceptionally large LaTeX auxiliary files.
          # Overrides TeX Live's default string pool (the previous run
          # failed at its ~5.8 million-character limit).
          pool_size: "30000000"
        run: |
          echo "Effective XeTeX pool_size: $(kpsewhich -var-value=pool_size)"
          test "$(kpsewhich -var-value=pool_size)" -eq 30000000
          . ./export.sh
          cd docs
          build-docs -bs latex -t esp32c61 -l en

      # Save an already generated PDF even if a later LaTeX pass fails.
      # This does not mark the build successful; logs remain available.
      - name: Check for generated PDF (also after failure)
        if: always()
        shell: bash
        run: |
          PDF_DIR="docs/_build/en/esp32c61/latex/build"
          echo "Checking ${PDF_DIR}"
          if [ -d "$PDF_DIR" ]; then
            find "$PDF_DIR" -maxdepth 1 -type f -name '*.pdf' -printf '%f (%s bytes)\n'
            while IFS= read -r -d '' file; do
              pdfinfo "$file" | grep -E '^(Pages|Page size|File size):' || true
            done < <(find "$PDF_DIR" -maxdepth 1 -type f -name '*.pdf' -size +0c -print0)
          else
            echo "No LaTeX build directory found"
          fi

      - name: Upload existing PDF even if LaTeX build fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ESP-IDF-v6.1.1-ESP32C61-PDF-first-pass
          path: docs/_build/en/esp32c61/latex/build/*.pdf
          if-no-files-found: warn
          retention-days: 7

      - name: Diagnose LaTeX failure
        if: failure()
        shell: bash
        run: |
          echo '=== LaTeX log files ==='
          find docs/_build/en/esp32c61/latex -type f \( -name '*.log' -o -name '*.fls' -o -name '*.tex' -o -name '*.fdb_latexmk' \) -print | head -50 || true
          LOG=$(find docs/_build/en/esp32c61/latex -type f -name 'esp-idf-en-v6.1.1-esp32c61.log' -print -quit)
          if [ -n "$LOG" ]; then
            echo "=== Last 180 lines of $LOG ==="
            tail -n 180 "$LOG"
            echo '=== Potential LaTeX errors ==='
            grep -n -E '^!|^l\.[0-9]+|LaTeX Error|Emergency stop|Fatal error|not found|Missing|Undefined control sequence|cannot find' "$LOG" | tail -n 80 || true
          else
            echo 'The expected LaTeX log is missing; listing build directory:'
            ls -lah docs/_build/en/esp32c61/latex/ || true
            ls -lah docs/_build/en/esp32c61/latex/build/ || true
          fi

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ESP32C61-PDF-Diagnostics
          path: |
            docs/_build/en/esp32c61/latex/**/*.log
            docs/_build/en/esp32c61/latex/**/*.tex
            docs/_build/en/esp32c61/sphinx-build-output-latex.txt
            docs/_build/en/esp32c61/sphinx-warning-log.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Verify generated PDF
        shell: bash
        run: |
          mapfile -d '' pdfs < <(find docs/_build/en/esp32c61/latex \
            -type f -name '*.pdf' -size +0c -print0)
          if [ "${#pdfs[@]}" -eq 0 ]; then
            echo 'ERROR: No nonempty PDF generated.' >&2
            exit 1
          fi
          for pdf in "${pdfs[@]}"; do
            pdfinfo "$pdf" | grep -E '^(Pages|Page size|File size):'
            echo "Verified PDF: $pdf"
          done

      - name: Upload generated PDFs
        uses: actions/upload-artifact@v4
        with:
          name: ESP-IDF-v6.1.1-ESP32C61-English-PDF
          path: docs/_build/en/esp32c61/latex/**/*.pdf
          if-no-files-found: error
          retention-days: 7
