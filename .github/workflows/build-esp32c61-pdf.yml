          pdf_file_prefix = 'esp-idf'

          import os as _pdf_os
          mermaid_params = [
              '-p',
              _pdf_os.path.abspath(
                  _pdf_os.path.join(_pdf_os.path.dirname(__file__), '..', 'puppeteer-config.json')
              ),
          ]
          EOF_PDF

      - name: Build ESP32-C61 PDF
        shell: bash
        run: |
          . ./export.sh
          cd docs
          build-docs -bs latex -t esp32c61 -l en

      - name: Diagnose LaTeX failure
        if: failure()
        shell: bash
        run: |
          echo '=== LaTeX log files ==='
          find docs/_build/en/esp32c61/latex -type f \( -name '*.log' -o -name '*.fls' -o -name '*.tex' -o -name '*.fdb_latexmk' \) -print | head -50 || true
          LOG=$(find docs/_build/en/esp32c61/latex -type f -name 'esp-idf-en-v6.1.1-esp32c61.log' -print -quit)
          if [ -n "$LOG" ]; then
            echo "=== Last 180 lines of $LOG ==="
            tail -n 180 "$LOG"
            echo '=== Potential LaTeX errors ==='
            grep -n -E '^!|^l\.[0-9]+|LaTeX Error|Emergency stop|Fatal error|not found|Missing|Undefined control sequence|cannot find' "$LOG" | tail -n 80 || true
          else
            echo 'The expected LaTeX log is missing; listing build directory:'
            ls -lah docs/_build/en/esp32c61/latex/ || true
            ls -lah docs/_build/en/esp32c61/latex/build/ || true
          fi

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ESP32C61-PDF-Diagnostics
          path: |
            docs/_build/en/esp32c61/latex/**/*.log
            docs/_build/en/esp32c61/latex/**/*.tex
            docs/_build/en/esp32c61/sphinx-build-output-latex.txt
            docs/_build/en/esp32c61/sphinx-warning-log.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Verify generated PDF
        shell: bash
        run: |
          mapfile -d '' pdfs < <(find docs/_build/en/esp32c61/latex \
            -type f -name '*.pdf' -size +0c -print0)
          if [ "${#pdfs[@]}" -eq 0 ]; then
            echo 'ERROR: No nonempty PDF generated.' >&2
            exit 1
          fi
          for pdf in "${pdfs[@]}"; do
            pdfinfo "$pdf" | grep -E '^(Pages|Page size|File size):'
            echo "Verified PDF: $pdf"
          done

      - name: Upload generated PDFs
        uses: actions/upload-artifact@v4
        with:
          name: ESP-IDF-v6.1.1-ESP32C61-English-PDF
          path: docs/_build/en/esp32c61/latex/**/*.pdf
          if-no-files-found: error
          retention-days: 7
